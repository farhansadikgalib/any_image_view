name: any_image_view
version: 2.5.0

description: "A dependency-free Flutter image viewer: PNG, JPG, WebP, GIF, AVIF, HEIC, SVG, Lottie, XFile, local files and disk-cached network images in one widget."
topics:
  - image-viewer
  - svg
  - lottie
  - image

homepage: https://farhansadikgalib.com/
repository: https://github.com/farhansadikgalib/any_image_view
issue_tracker: https://github.com/farhansadikgalib/any_image_view/issues
documentation: https://pub.dev/documentation/any_image_view/latest/

screenshots:
  - description: "any image view"
    path: raw/banner.png

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
